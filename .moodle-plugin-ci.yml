# moodle-plugin-ci configuration.
#
# The bundled Mercado Pago SDK is third-party code and is excluded from every
# lint and style check here.
#
# This file and thirdpartylibs.xml must agree about what is third-party. They
# serve different consumers -- this one CI, that one the Moodle Marketplace
# precheck -- and a disagreement means one of them is wrong. If the Marketplace
# `thirdparty` precheck reports errors in vendor/mercadopago, the problem is in
# thirdpartylibs.xml, not here.

filter:
  notPaths:
    - vendor
  notNames:
    - "*-min.js"
    - "*.min.css"
