# Moodle Plugin CI for enrol_mercadopagocpro.
#
# Runs the same checks the Moodle Marketplace runs as automated prechecks
# (moodle-plugin-ci bundles moodlehq/moodle-cs and moodlehq/moodle-local_ci,
# which are those checks), plus the PHPUnit and Behat suites, across both
# database engines.
#
# The PostgreSQL leg is not optional decoration: "your SQL fails on PostgreSQL
# even when working on MySQL" is an explicit approval blocker, and this plugin
# has only ever been exercised by hand on MariaDB.
#
# VERIFY BEFORE FIRST USE: option names and step shape change between
# moodle-plugin-ci minor releases. Diff this against the current template at
# https://moodlehq.github.io/moodle-plugin-ci/ for the version pinned below.

name: Moodle Plugin CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        # Production runs MariaDB 12.3 LTS. Bump this once the tag is confirmed
        # to exist and Moodle 5.2 is happy with it; 11 is the safe floor.
        image: mariadb:11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        moodle-branch: ['MOODLE_502_STABLE']
        database: ['pgsql', 'mariadb']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, intl, soap, xml, mbstring, curl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
              moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # The eight checks below mirror the Marketplace prechecks. `if: !cancelled()`
      # makes every one run even after an earlier failure, so a single push
      # reports the full picture instead of one error at a time.

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Behat exercises the instance form, the HTTPS guard and the pay button --
      # none of it database-dependent -- so one leg of the matrix is enough
      # signal for the cost.
      - name: Behat features
        if: ${{ !cancelled() && matrix.database == 'pgsql' && matrix.php == '8.4' }}
        run: moodle-plugin-ci behat --profile chrome
